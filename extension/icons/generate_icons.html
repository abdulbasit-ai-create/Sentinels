<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Generate Icons — Sentinels</title>
<style>
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #1a1a2e;
    color: #e0e0e0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem;
  }
  h1 { color: #00d4aa; margin-bottom: 0.25rem; }
  p { color: #888; margin-bottom: 2rem; }
  .preview-row {
    display: flex;
    gap: 2rem;
    align-items: flex-end;
    flex-wrap: wrap;
    justify-content: center;
  }
  .icon-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
  }
  .icon-card canvas {
    border: 1px solid #333;
    border-radius: 8px;
    background: #0f0f1a;
  }
  .icon-card .label {
    font-size: 0.8rem;
    color: #aaa;
    font-weight: 600;
  }
  button {
    margin-top: 2rem;
    background: #00d4aa;
    color: #0a0a1a;
    border: none;
    padding: 0.75rem 2rem;
    border-radius: 8px;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover { background: #00f0c0; }
  .note {
    margin-top: 1.5rem;
    font-size: 0.85rem;
    color: #666;
    max-width: 480px;
    text-align: center;
  }
  .status {
    margin-top: 1rem;
    padding: 0.5rem 1rem;
    border-radius: 6px;
    font-size: 0.9rem;
    min-height: 1.4em;
  }
  .status.ok { color: #00d4aa; }
  .status.err { color: #ff6b6b; }
</style>
</head>
<body>
<h1>🛡 Sentinels</h1>
<p>Icon Generator — downloads PNG at 16, 48, and 128px</p>

<div class="preview-row">
  <div class="icon-card">
    <canvas id="preview16" width="16" height="16"></canvas>
    <span class="label">16×16</span>
  </div>
  <div class="icon-card">
    <canvas id="preview48" width="48" height="48"></canvas>
    <span class="label">48×48</span>
  </div>
  <div class="icon-card">
    <canvas id="preview128" width="128" height="128"></canvas>
    <span class="label">128×128</span>
  </div>
</div>

<button id="downloadBtn">⬇ Download All Icons</button>
<div id="status" class="status"></div>

<div class="note">
  The shield icon uses the brand gradient (#00d4aa → #007bff) with a white checkmark.
  Downloaded files will replace icon16.png, icon48.png, icon128.png in the icons/ folder.
</div>

<script>
function drawShield(canvas) {
  const ctx = canvas.getContext('2d');
  const s = canvas.width; // size
  const pad = s * 0.08;
  const cx = s / 2;

  // Clear
  ctx.clearRect(0, 0, s, s);

  // Gradient background
  const grad = ctx.createLinearGradient(0, 0, s, s);
  grad.addColorStop(0, '#00d4aa');
  grad.addColorStop(1, '#007bff');
  ctx.fillStyle = grad;

  // Shield path
  ctx.beginPath();
  const t = pad;
  const b = s - pad;
  const w = s - 2 * pad;
  ctx.moveTo(cx, t);
  ctx.lineTo(b, t + w * 0.3);
  ctx.lineTo(b, b - w * 0.2);
  ctx.quadraticCurveTo(cx, b + pad * 0.5, t, b - w * 0.2);
  ctx.lineTo(t, t + w * 0.3);
  ctx.closePath();
  ctx.fill();

  // White checkmark
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = Math.max(2, s * 0.1);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  const ix1 = s * 0.30;
  const iy1 = s * 0.52;
  const ix2 = s * 0.44;
  const iy2 = s * 0.68;
  const ix3 = s * 0.70;
  const iy3 = s * 0.38;
  ctx.moveTo(ix1, iy1);
  ctx.lineTo(ix2, iy2);
  ctx.lineTo(ix3, iy3);
  ctx.stroke();
}

function downloadPNG(canvas, filename) {
  const link = document.createElement('a');
  link.download = filename;
  link.href = canvas.toDataURL('image/png');
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

// Draw all previews
const sizes = [16, 48, 128];
const canvases = {};
sizes.forEach(size => {
  const canvas = document.getElementById('preview' + size);
  drawShield(canvas);
  canvases[size] = canvas;
});

document.getElementById('downloadBtn').addEventListener('click', () => {
  const status = document.getElementById('status');
  try {
    sizes.forEach(size => {
      const c = document.createElement('canvas');
      c.width = size;
      c.height = size;
      drawShield(c);
      downloadPNG(c, 'icon' + size + '.png');
    });
    status.textContent = '✅ All icons downloaded successfully! Place them in the icons/ folder.';
    status.className = 'status ok';
  } catch (e) {
    status.textContent = '❌ Error: ' + e.message;
    status.className = 'status err';
  }
});

// Re-draw on first paint
window.addEventListener('load', () => {
  sizes.forEach(size => drawShield(document.getElementById('preview' + size)));
});
</script>
</body>
</html>
